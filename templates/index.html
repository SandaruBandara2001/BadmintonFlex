<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Shot Classification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .video-container { text-align: center; margin-top: 20px; }
        .info { font-size: 20px; font-weight: bold; margin-top: 20px; color: #28a745; }
    </style>
    <script>
        function uploadVideo(event) {
            event.preventDefault();
            let formData = new FormData(document.getElementById("uploadForm"));
            
            fetch("/predict", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.prediction) {
                    document.getElementById("shot_name").innerText = data.prediction;
                    document.getElementById("shot_accuracy").innerText = data.accuracy + "%";
                    document.getElementById("results").classList.remove("d-none");
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>

    <div class="container mt-5 text-center">
        <h2 class="text-primary">🏏 Cricket Shot Classification</h2>
        <p class="text-secondary">Upload a video to analyze the batting shot</p>

        <!-- Video Upload Form -->
        <form id="uploadForm" onsubmit="uploadVideo(event)">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" accept="video/*" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload & Analyze</button>
        </form>

        <!-- Prediction Info -->
        <div id="results" class="d-none mt-4">
            <p class="info">Shot Action: <span id="shot_name">Waiting...</span></p>
            <p class="info">Prediction Accuracy: <span id="shot_accuracy">0%</span></p>
        </div>
    </div>

</body>
</html>
